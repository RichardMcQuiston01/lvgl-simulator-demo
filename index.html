    <meta name="twitter:image" content="https://lvgl-simulator-demo.vercel.app/og-image.png" />

    <script>
      // Applied before first paint to avoid a flash of the wrong theme.
      // Kept in sync with the logic in src/lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('lvgl-demo-theme');
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (_error) {
          /* Non-fatal: falls back to the default (dark) look. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
